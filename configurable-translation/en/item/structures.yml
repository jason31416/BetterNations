# In this file you can manage the items for the BetterNations plugin and even create custom items for yourself!
categories:
  structure:
    name: "&b&lStructures"
    material: green_concrete

machinery:
  refinery:
    material: iron_block
  alloy-foundry:
    material: nether_bricks
  grinder:
    material: grindstone
  soul-extractor:
    material: obsidian

items: # You can create your own items!
  refinery:
    material: iron_block
    name: "&b&lRefinery"
    lore:
      - "&7Structure for refining resources such as fuel"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  alloy-foundry:
    material: nether_bricks
    name: "&b&lAlloy Foundry"
    lore:
      - "&7Structure for producing alloys"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  grinder:
    material: grindstone
    name: "&b&lGrinder"
    lore:
      - "&7Structure for grinding resources"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  soul-extractor:
    material: obsidian
    name: "&b&lSoul Extractor"
    lore:
      - "&7Structure for extracting souls from undead"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  graveyard:
    material: mossy_stone_bricks
    name: "&b&lUndead Graveyard"
    lore:
      - "&7Structure for producing undead units"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  spiderweb:
    material: cobweb
    name: "&b&lSpider Web"
    lore:
      - "&7Structure for producing arthropod units"
