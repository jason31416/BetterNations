# This is the language file of the plugin
# You shouldn't be adding/removing items from this file, but you can always edit its values.
# Most of the messages supports both minimessage and bukkit & color format, while some only supports the bukkit color codes.

# These are terms that are used across the plugin. If possible, please don't add color codes in variables in this section.
term:
  nation: "Nation"
  town: "Town"
  town-role:
    mayor: "Mayor"
    manager: "Manager"
    resident: "Resident"
    greencard: "Greencard"
    none: "None"

structure:
  towncore:
    hologram: "&8-= %nation_color%%town% &7- &bTown Core &8=-"
  graveyard:
    hologram: "&8-= &bGraveyard &8=-"
  spiderweb:
    hologram: "&8-= &bSpiderweb &8=-"
  ominous-outpost:
    hologram: "&8-= &bOminous Outpost &8=-"
  granary:
    hologram: "&8-= &bGranary &7(%supply%/%max_supply% &e🌾&7) &8=-"
  outpost:
    hologram: "&8-= &bOutpost &8=-"
    already-exists: "&cThere is already an outpost in this chunk!"
  townruin:
    hologram: "&8-= &8%town% Ruins &8=-"
    message:
      claimed: "<red>This chunk has been claimed by another nation!"
      no_nation: "<red>You don't have a nation! Use <yellow>/n create nation_name<red> to create one here!"
      interact: "<#2288ff>SHIFT+click this block to create a town here! <red>(Costs %cost% gold)"
  extractor:
    hologram: "&8-= &bExtractor &7(%item% &r&7x%current%) &8=-"
    already-exists: "&cThere is already an extractor in this chunk!"
    no-resources: "&cThere are no resource in the chunk to extract!"
  machinery:
    progress-item:
      active:
        name: "&aProducing..."
        lore:
          - "&7Time left: &a%time%"
      inactive:
        name: "&fIdle"
        lore: []
    input: "&aInput"
    output: "&bOutput"

  # Messages for the default machines
  refinery:
    hologram: "&bRefinery"
  alloy-foundry:
    hologram: "&8Alloy Forge"
  grinder:
    hologram: "&7Grinder"
  soul-extractor:
    hologram: "&aSoul Extractor"
  upgrade:
    usable-slot-name: "&a&lUpgrade Slot"
    usable-slot-lore:
      - "&7You can put your upgrade slot here"
    unusable-slot-name: "&c&lLocked upgrade slot"
    unusable-slot-lore:
      - "&7You need to use a slot upgrade to unlock this slot"

