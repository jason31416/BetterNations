# These are messages that are related to nations.
nation:
  type:
    gui-name: "&fGovernment: %type_name%"
    gui-lore:
      - "&7%type_description%"
    monarchy:
      name: "Monarchy"
      description: "Centralized power ensures national stability"
      material: YELLOW_WOOL
    democracy:
      name: "Democracy"
      description: "Freedom, democracy, but is it really efficient?"
      material: BLUE_WOOL
    republic:
      name: "Republic"
      description: "A balance between reality and ideals"
      material: ORANGE_WOOL
    autocracy:
      name: "Autocracy"
      description: "All power to the ruler!"
      material: RED_WOOL
    anarchy:
      name: "Anarchy"
      description: "In the whirlpool of aimless politics, let's return power to the people"
      material: BLACK_WOOL
  rank: # NOT ORDERED, JUST TRANSLATIONS
    king: "King"
    general: "General"
    knight: "Knight"
    peasant: "Peasant"
    member: "Member"
    citizen: "Citizen"
    leader: "Leader"
    subject: "Subject"
    representative: "Representative"
    president: "President"
    officer: "Officer"
    dictator: "Dictator"
  resolution:
    proposed: "<#2288ff>Player<#00ddff> %proposer% <#2288ff>proposed a resolution: <#00ddff><u><click:run_command:/nation resolution info %resolution_id%>%resolution_name%</click></u> &7(click to view)"
    signed: "<green>[+] <#2288ff>Player<#00ddff> %signer% <#2288ff>approved resolution: <#00ddff><u><click:run_command:/nation resolution info %resolution_id%>%resolution_name%</click></u> &7(click to view)"
    unsigned: "<red>[-] <#2288ff>Player<#00ddff> %signer% <#2288ff>rejected resolution: <#00ddff><u><click:run_command:/nation resolution info %resolution_id%>%resolution_name%</click></u> &7(click to view)"
    passed: "<#2288ff>Resolution passed: <#00ddff><click:run_command:/nation resolution info %resolution_id%>%resolution_name%</click>"
    cannot-propose: "<red>You can't propose this resolution!"
    duplicate-exists: "<red>There is already an identical resolution: <#00ddff><u><click:run_command:/nation resolution info %resolution_id%>%resolution_name%</click></u> &7(click to view)"
    list:
      header: "&7----= <#2288ff>%nation% Resolutions &7=----"
      no-resolution: "&l&7[&e!&7] &fYour nation has no active resolutions!"
      item-with-permission: "&7- &f%content% <u><click:run_command:/nation resolution info %resolution_id%>&a[View]</click></u>"
      item-no-permission: "&7- &f%content% <u><click:run_command:/nation resolution info %resolution_id%>&7[View]</click></u>"
    info:
      - "&7<click:run_command:/nation resolution list>[<] Back to resolutions</click>"
      - "&7----= <#2288ff>%nation% Resolution &7=----"
      - ""
      - "&l%content%"
      - ""
      - "&7Proposer: &f%proposer%"
      - "&7Signed: &f%signed_players_count%"
      - "&7%signed_players%"
      - "&a<click:run_command:/nation resolution sign %resolution_id%>[Approve]</click> &7| &c<click:run_command:/nation resolution decline %resolution_id%>[Reject]</click>"
    info-no-permission:
      - "&7<click:run_command:/nation resolution list>[<] Back to resolutions</click>"
      - "&7----= <#2288ff>%nation% Resolution &7=----"
      - ""
      - "&l%content%"
      - ""
      - "&7Proposer: &f%proposer%"
      - "&7Signed: &f%signed_players_count% &7/ &f%required_signers%"
      - "&7%signed_players%"
    description:
      declare-war: "%from% declares war on %to%"
      disband-nation: "Disband %nation%"
      revoke-alliance: "%from% revokes alliance with %to%"
      kick-player: "Kick %target% from %nation%"
      join-nation: "Accept %requester% into %nation%"
      set-rank: "Set %target% as %rank%"
      rename-nation: "Rename %name% to %new_name%"
      sign-treaty: "%nation% signs treaty: <hover:show_text:'/nation treaty view %treaty%'>%treaty%</hover>"
      veto-treaty: "%nation% vetoes treaty: <hover:show_text:'/nation treaty view %treaty%'>%treaty%</hover>"
      change-type: "%nation% changes government to %type%"

