# This is the language file of the plugin
# You shouldn't be adding/removing items from this file, but you can always edit its values.
# Most of the messages supports both minimessage and bukkit & color format, while some only supports the bukkit color codes.

# These are terms that are used across the plugin. If possible, please don't add color codes in variables in this section.
term:
  nation: "国家"
  town: "城镇"
  town-role:
    mayor: "镇长"
    manager: "管理者"
    resident: "居民"
    greencard: "绿卡"
    none: "无"

structure:
  towncore:
    hologram: "&8-= %nation_color%%town% &7- &b城镇核心 &8=-"
  graveyard:
    hologram: "&8-= &b亡灵墓园 &8=-"
  spiderweb:
    hologram: "&8-= &b蛛网 &8=-"
  ominous-outpost:
    hologram: "&8-= &b灾厄哨塔 &8=-"
  granary:
    hologram: "&8-= &b粮仓 &7(%supply%/%max_supply% &e🌾&7) &8=-"
  outpost:
    hologram: "&8-= &b前哨 &8=-"
    already-exists: "&c该区块已经有一个前哨了!"
  extractor:
    hologram: "&8-= &b资源开采机 &7(+%current%) &8=-"
    already-exists: "&c该区块已经有一个资源开采机了!"
    no-resources: "&c该区块没有可供开采的资源!"
  townruin:
    hologram: "&8-= &8%town% 城镇遗迹 &8=-"
    message:
      claimed: "<red>该区块已被其他国家占领!"
      no_nation: "<red>你还没有一个国家！请使用<yellow>/n create 国名<red>在此创建国家!"
      interact: "<#2288ff>SHIFT+点击本方块来在此处创建一个城镇! <red>(需要花费%cost%金币)"

  machinery:
    progress-item:
      active:
        name: "&a生产中..."
        lore:
          - "&7剩余时间: &a%time%"
      inactive:
        name: "&f闲置中"
        lore: []
    input: "&a输入"
    output: "&b输出"

  # Messages for the default machines
  refinery:
    hologram: "&b精炼厂"
  alloy-foundry:
    hologram: "&8合金熔炉"
  grinder:
    hologram: "&7研磨机"
  soul-extractor:
    hologram: "&a灵魂提取器"

