# In this file you can manage the items for the BetterNations plugin and even create custom items for yourself!

# NOTE: YOU SHOULD CHANGE THIS AS IT IS LIKELY NOT SUITABLE AND BALANCED FOR COMPLEX SERVERS!

# This is just an example of how to create custom items and categories. You can delete this and create your own items and categories.
# Also, there is a preset configuration made for 1.21+ servers in the git repository (https://gitee.com/jason31416/betternations/tree/main/configurable-translation) for you.
# You can ask for help on jason31416@163.com or on the BetterNations QQ group (458787362)

categories:
  ingredient:
    name: "&b&lIngredients"
    material: iron_ingot

items:
