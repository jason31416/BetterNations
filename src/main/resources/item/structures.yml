# In this file you can manage the items for the BetterNations plugin and even create custom items for yourself!

# NOTE: YOU SHOULD CHANGE THIS AS IT IS LIKELY NOT SUITABLE AND BALANCED FOR COMPLEX SERVERS!

# This is just an example of how to create custom items and categories. You can delete this and create your own items and categories.
# Also, there is a preset configuration made for 1.21+ servers in the git repository (https://gitee.com/jason31416/betternations/tree/main/configurable-translation) for you.
# You can ask for help on jason31416@163.com or on the BetterNations QQ group (458787362)

categories:
  structure:
    name: "&b&lStructures &7- EXAMPLE"
    material: green_concrete

machinery:
  alloy-foundry:
    material: nether_bricks

items: # You can create your own items!
  alloy-foundry:
    material: nether_bricks
    name: "&b&lAlloy Foundry"
    lore:
      - "&7Structure for producing alloys"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  graveyard:
    material: mossy_stone_bricks
    name: "&b&lUndead Graveyard"
    lore:
      - "&7Structure for producing undead units"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  granary:
    material: hay_block
    name: "&b&lGranary"
    lore:
      - "&7Provides supplies to troops and production structures in the chunk"
      - "&7Convert food into supply points by right-clicking on the structure with food in hand"
      - "&7Right-click to place"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
  outpost:
    material: bell
    name: "&b&lOutpost"
    lore:
      - "&7Maintains stability of exclaves"
      - "&7If an exclave has no outpost, enemies only need to capture one chunk to take over the entire exclave!"
      - ""
      - "&8[BetterNations Structure]"
    category: structure

# Recipes don't need translation as they use material codes
recipes:
  alloy-foundry:
    type: crafting
    product: alloy-foundry
    shape:
      - "i i"
      - "ili"
      - "bcb"
    material:
      i: iron_block
      l: lava_bucket
      b: reinforced-bricks
      c: magma_block
  outpost:
    type: crafting
    product: outpost
    shape:
      - "sns"
      - "wgw"
      - "sws"
    material:
      g: granary
      w: wood
      s: steel-chunk
      n: beacon
  granary:
    type: crafting
    product: granary
    shape:
      - "ccc"
      - "chc"
      - "ccc"
    material:
      c: hay_block
      h: barrel
  graveyard:
    type: crafting
    product: graveyard
    shape:
      - " u "
      - "wtw"
      - "ddd"
    material:
      w: wood
      t: tomb
      u: undead-essence
      d: dirt