# In this file you can manage the items for the BetterNations plugin and even create custom items for yourself!
categories:
  structure:
    name: "&b&lStructures"
    material: green_concrete

items: # You can create your own items!
  graveyard:
    material: mossy_stone_bricks
    name: "&b&lUndead Graveyard"
    lore:
      - "&7Structure for producing undead units"
      - "&7Right-click to place (must be placed within town territory)"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
    model: 31437
  spiderweb:
    material: cobweb
    name: "&b&lSpider Web"
    lore:
      - "&7Structure for producing arthropod units"
      - "&7Right-click to place (must be placed within town territory)"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
    model: 31438
  ominous-outpost:
    material: dark_oak_wood
    name: "&b&lPillager Outpost"
    lore:
      - "&7Structure for producing illager units"
      - "&7Right-click to place (must be placed within town territory)"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
    model: 31439
  granary:
    material: hay_block
    name: "&b&lGranary"
    lore:
      - "&7Provides supplies to troops and production structures in the chunk"
      - "&7Convert food into supply points by right-clicking on the structure with food in hand"
      - "&7Right-click to place (must be placed within town territory)"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
    model: 31440
  outpost:
    material: bell
    name: "&b&lOutpost"
    lore:
      - "&7Maintains stability of exclaves"
      - "&7If an exclave has no outpost, enemies only need to capture one chunk to take over the entire exclave!"
      - ""
      - "&8[BetterNations Structure]"
    category: structure
    model: 31441

# Recipes don't need translation as they use material codes
recipes:
  outpost:
    type: crafting
    product: outpost
    shape:
      - "sns"
      - "wgw"
      - "sws"
    material:
      g: granary
      w: wood
      s: steel-chunk
      n: beacon
  granary:
    type: crafting
    product: granary
    shape:
      - "ccc"
      - "chc"
      - "ccc"
    material:
      c: hay_block
      h: barrel
  graveyard:
    type: crafting
    product: graveyard
    shape:
      - " u "
      - "wtw"
      - "ddd"
    material:
      w: wood
      t: tomb
      u: undead-essence
      d: dirt
  spiderweb:
    type: crafting
    product: spiderweb
    shape:
      - "sws"
      - "wfw"
      - "sws"
    material:
      w: cobweb
      f: fermented_spider_eye
      s: silk
  ominous-outpost:
    type: crafting
    product: ominous-outpost
    shape:
      - "ese"
      - "wlw"
      - "fmf"
    material:
      w: dark_oak_wood
      s: steel-chunk
      e: emerald_block
      f: dark_oak_fence
      m: mechanical-chip
      l: white_wool
