# This section controls the production of land armies
# Please do not delete/alter it when a unit production facility is already built in the server, or unexpected bugs may happen.
production:
  fortress:
    material: CHISELED_NETHER_BRICKS
    recipes:
      wither-skeleton-equipment:
        type: wither-skeleton
        time: 14400

  graveyard: # The ID of the production facility structure. An item with the same id should exist as well!
    material: MOSSY_STONE_BRICKS # The block used for the structure. Not case-sensitive
    recipes:
      basic-zombie-equipment: # The item ID of the material that is used to produce this recipe. It should exist in items.yml. NEVER SET THIS TO AIR!!!!!!!
        type: basic-zombie # The unit ID of the army type listed above.
        time: 1200 # How long does it take to produce it? (in seconds)
      trained-zombie-equipment: # The item ID of the material that is used to produce this recipe. It should exist in items.yml. NEVER SET THIS TO AIR!!!!!!!
        type: trained-zombie # The unit ID of the army type listed above.
        time: 2400 # How long does it take to produce it? (in seconds)
      advanced-zombie-equipment: # The item ID of the material that is used to produce this recipe. It should exist in items.yml. NEVER SET THIS TO AIR!!!!!!!
        type: advanced-zombie # The unit ID of the army type listed above.
        time: 7200 # How long does it take to produce it? (in seconds)
      zombified-piglin-equipment: # The item ID of the material that is used to produce this recipe. It should exist in items.yml. NEVER SET THIS TO AIR!!!!!!!
        type: zombified-piglin # The unit ID of the army type listed above.
        time: 7200 # How long does it take to produce it? (in seconds)
      zombie-king-equipment: # The item ID of the material that is used to produce this recipe. It should exist in items.yml. NEVER SET THIS TO AIR!!!!!!!
        type: zombie-king # The unit ID of the army type listed above.
        time: 64800 # How long does it take to produce it? (in seconds)
  spiderweb:
    material: COBWEB
    recipes:
      spider-equipment:
        type: spider
        time: 7200
      cave-spider-equipment:
        type: cave-spider
        time: 14400
  ominous-outpost:
    material: DARK_OAK_WOOD
    recipes:
      vindicator-equipment:
        type: vindicator
        time: 14400
      armored-vindicator-equipment:
        type: armored-vindicator
        time: 28800
      evoker-equipment:
        type: evoker
        time: 43200
      ravager-equipment:
        type: ravager
        time: 86400
