
# This section controls the land army's types.
# Please do not delete anything when it already has been produced in the server, or unexpected bugs may happen.
types:
  infantry:
    name: "基础步兵" # The display name of the army type
    armor: unarmed # This can be: unarmed/armored
    type: zombie # This is the entity form of the mob when defending. Can be mythic(if installed) or vanilla.
    icon: iron_sword # The item displayed on the GUI view. Not case-sensitive
    hp: 15.0 # The health of the unit
    supply: 28.8 # The max. supply one unit can carry in the army. This will sustain this unit for 2 days exactly
    consume: 0.05 # How many supply does it consume every army tick (default 5 minutes)
    damage: # The damages dealt to other armor types when engaging in virtual combats. If not listed, the default is 0
      # If you want to change these, remember to do so as well in items.yml for display!
      unarmed: 2.0
      armored: 0.5
      territory: 0.5 # Its damage dealt to territories such as chunks/towns
  advanced-infantry:
    name: "高级步兵"
    armor: unarmed
    type: zombie
    icon: iron_helmet
    hp: 25.0
    supply: 28.8
    consume: 0.055
    damage:
      unarmed: 3.0
      armored: 0.7
      territory: 0.8
  armored-infantry:
    name: "重甲步兵"
    armor: armored
    type: vindicator
    icon: iron_chestplate
    hp: 40.0
    supply: 28.8
    consume: 0.06
    damage:
      unarmed: 4.0
      armored: 1.2
      territory: 1.0
  mechanized-infantry:
    name: "机械化步兵"
    armor: armored
    type: vindicator
    icon: redstone
    hp: 70.0
    supply: 43.2
    consume: 0.07
    damage:
      unarmed: 5.0
      armored: 1.8
      territory: 1.5
  modernized-infantry:
    name: "现代化步兵"
    armor: armored
    type: vindicator
    icon: diamond_chestplate
    hp: 120.0
    supply: 57.6
    consume: 0.1
    damage:
      unarmed: 6.5
      armored: 2.3
      territory: 1.9

# This section controls the production of land armies
# Please do not delete/alter it when a unit production facility is already built in the server, or unexpected bugs may happen.
production:
  barrack: # The ID of the production facility structure. An item with the same id should exist as well!
    material: GREEN_CONCRETE # The block used for the structure. Not case-sensitive
    recipes:
      infantry: # The item ID of the material that is used to produce this recipe. It should exist in items.yml.
        type: infantry # The unit ID of the army type listed above.
        time: 10 # How long does it take to produce it? (in seconds) [todo: THIS IS FOR TESTING]
      advanced-infantry:
        type: advanced-infantry
        time: 7200 # 2hrs
      armored-infantry:
        type: armored-infantry
        time: 14400 # 4hrs
      mechanized-infantry:
        type: mechanized-infantry
        time: 28800 # 8hrs
      modernized-infantry:
        type: mechanized-infantry
        time: 43200 # 12hrs