# This section controls the land army's types.
# Please do not delete anything when it already has been produced in the server, or unexpected bugs may happen.
# In addition, it is suggested to not create too much (Preferred less than 14, would still work with less than 28) types since the UI isn't really big enough.
# However, if you are fine with display issues when stacking over 14 types, it shouldn't cause any further issue.

types:
  basic-zombie:
    name: "基础僵尸" # The display name of the army type
    armor: unarmed # This can be: unarmed/armored
    type: BasicZombieUnit # This is the entity form of the mob when defending. Can be mythic(if installed) or vanilla.
    icon: wooden_sword # The item displayed on the GUI view. Not case-sensitive
    hp: 10.0 # The health of the unit
    supply: 22.0 # The max. supply one unit can carry in the army.
    consume: 0.01 # How many supply does it consume every army tick (default 5 minutes)
    damage: # The damages dealt to other armor types when engaging in virtual combats. If not listed, the default is 0
      # If you want to change these, remember to do so as well in items.yml for display!
      unarmed: 0.1
      armored: 0.1
      territory: 0.1 # Its damage dealt to territories such as chunks/towns
  trained-zombie:
    name: "士兵僵尸"
    armor: unarmed
    type: TrainedZombieUnit
    icon: stone_sword
    hp: 10.0
    supply: 28.8
    consume: 0.015
    damage:
      unarmed: 3.0
      armored: 0.7
      territory: 0.7
  advanced-zombie:
    name: "高级僵尸"
    armor: unarmed
    type: AdvancedZombieUnit
    icon: iron_sword
    hp: 20.0
    supply: 28.8
