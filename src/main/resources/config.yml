# It is strongly recommended to increase the spigot.yml health limit (settings.attribute.maxHealth) to around 100,000+!
# This is because some stacks may have higher HP values
# Although not increasing it shouldn't cause any fatal issues, but there might be some issues with stacks over that limit

# The language of the plugin
# Please make sure the file exists in the /lang folder
lang: en_us

naming:
  min-length: 3
  max-length: 18

enabled-worlds: # This option controls worlds that enable claiming. Set it to [] to enable in everywhere
  - world

# Nation-related settings
nation:
  creation-cost: 1000 # The cost of creating a nation
  capital-name: "%nation% Capital"
  claim-cost: 10 # The cost of claiming a chunk
  unclaim-refund: 8 # The refund of unclaiming a chunk
  prevent-unfriendly-elytra: true # Should we stop unfriendly players from flying in claimed chunks

# Town-related settings
town:
  creation-cost: 400 # The cost of creating a town
  claim-cost: 30 # The (additional) cost of claiming a chunk as a town chunk
  unclaim-refund: 10 # The refund of unclaiming a chunk as a town chunk
  teleport-countdown: 5 # The countdown for /k tp
  hp-recover-speed: 1.5 # How many HP to recover per update?

  # Should we require a ruin to create a town? (Useful for more RPG-like servers, require server owner to manually place ruins via /n ruin)
  # If you are willing to enable this, you should probably also remove the outpost item from the item/structures file to force players to orient around the ruins.
  require-ruin: false

  # Should we allow nations with no towns? (only when the require-ruin option is enabled)
  # Nomadic nations are nations without towns and cannot claim, but can still build up their army and potentially conquer one of the existing towns.
  allow-nomadic: true

  dev-points:
    drop-per-day: 10.0 # decrease per day
    max-day-exist: 600 # 600 seconds (must be integer) (10 minutes) "exist" bonus valid for each town per day per player max.
    exists: 0.1 # per second
    block-place: 1.0 # per block placed
  levels: # In fact, you can even create your own levels! However please make sure that all of their points are distinct.
    wildland:
      name: "Wildland"
      points: 0.0
      material: GRASS_BLOCK
    settlement:
      name: "Settlement"
      points: 30.0
      material: CAMPFIRE
    village:
      name: "Village"
      points: 500.0
      material: OAK_PLANKS
    town:
      name: "Town"
      points: 4500.0
      material: STONE_BRICKS
    city:
      name: "City"
      points: 13500.0
      material: IRON_BLOCK
    metropolis:
      name: "Metropolis"
      points: 42500.0
      material: DIAMOND_BLOCK

treaty:
  creation-cost: 50
  max-terms: 20

map:
  width: 9 # This value *2+1 is the actual size of the map
  height: 6 # This value *2+1 is the actual size of the map

border-display: # [Most options in this section require restart to take effect]
  nation-border: true
  town-border: true

  range: 3 # in chunks
  interval: 15 # in ticks
  particle-size: 1.5

combat:
  damage-units: 10 # top 10 units are counted toward the stack's total damage
  defend-units: 10 # 10 entities can be spawned at the same time to defend camps/invasions

  chunk-hp: 10 # How many hp does a single chunk have

  transport-mob: zombie
  army-tick-interval: 900 # How long in seconds does all of the combats update?
  transport-max-distance: 64 # The unit must be within 64 blocks of the player, or else its gonna be destroyed
  transport-warn-distance: 56

  enable-animation: true
  particle-interval: 5
  particle-speed: 1.0 # Usually this is fine
  particle-frequency: 20 # In ticks, must be multiples of 5

  enable-supply-system: true # Setting this to false would disable the update checks of the supply system. It is recommended to also remove the granary system & the supply display from the items/the units
  granary-supply-limit: 720.0 # The max. supply points a single granary can hold
  supply-regain-speed: 20.0 # The max. supply points per army update tick that can be transferred from the granary to army

  disabled-damage-source:
    - SUFFOCATION
    - FALL
    - LAVA
    - BLOCK_EXPLOSION
    - ENTITY_EXPLOSION
    - DRAGON_BREATH

# This section contains all of the foods that can be converted into supply points
# The key should be a valid food item's ID, the value should be its supply points worth.
# Note that the item can also be a BetterNations added item
supply:
  cod: 1.0
  salmon: 1.0
  tropical_fish: 1.0
  rotten_flesh: 0.1
  pumpkin_pie: 5.0
  apple: 2.5
  beef: 2.0
  potato: 1.25
  melon_slice: 1.25
  porkchop: 1.5
  mutton: 1.5
  chorus_fruit: 1.0
  chicken: 1.0
  rabbit: 1.5
  bread: 2.25
  carrot: 1.25
  cooked_chicken: 2.5
  cooked_rabbit: 3.5
  sweet_berries: 0.5
  glow_berries: 0.5
  beetroot: 1.0
  cooked_cod: 2.0
  baked_potato: 2.0
  cooked_porkchop: 4.0
  cooked_beef: 5.5
  cooked_mutton: 4.0
  cooked_salmon: 2.0
  golden_carrot: 8.0
  golden_apple: 12.0
  pure-energy: 256.0

multiplier: # everything multiply by these numbers, affects globally in the plugin. Used to make configuration easier
  army-train-speed: 1.0 # increase this = decrease speed
  army-damage: 1.0
  army-hp: 1.0
  army-max-supply: 1.0
  army-supply-consumption: 1.0
  food-supply-conversion: 1.0 # multiply the above "supply" section
  global-cost: 1.0 # multiply everything that costs money (also multiply the refund when unclaimed)

bluemap:
  nation-layer-height: 95 # The height that the nation markers should be on
  town-layer-height: 96 # The height that the town markers should be on
  max-view-distance: 100000 # Usually this is fine :D
  town-max-view-distance: 100000 # As well as this one
  line-width: 5
  check-interval: 20 # in ticks, how frequent should the plugin update the map (almost completely async ;) )